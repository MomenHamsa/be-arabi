<script>
if (location.protocol !== "file:") {
  /* Preload only the display weight the LCP element needs; Bold and Regular
     stream in via @font-face + font-display:swap. Cut render delay by ~60%
     vs preloading all three. */
  var l = document.createElement("link");
  l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "";
  l.href = "fonts/dg-tebian-black.woff2";
  document.head.appendChild(l);
}
</script>
<link rel="stylesheet" href="site.css">

<!-- ============ CRM-READY PRODUCT TEMPLATE ==============================
     This page reads a product from a JSON file keyed by URL parameter:
         product.html?id=<slug>
     Default: sadu-pillow. Data lives at products/data/<slug>.json.

     WHEN A REAL CRM SHIPS:
     Swap the fetch in site.js (loadProduct fn) from:
         fetch('products/data/' + id + '.json')
     to:
         fetch('/api/products/' + id)          (or your CRM endpoint)
     The rendering code below the fetch does not change — the CRM just
     needs to return the same JSON shape documented in
     products/data/sadu-pillow.json.

     A skeleton state is visible immediately; renderProduct(data) replaces
     it once the JSON arrives. If the fetch fails, an error state renders
     with a link back to the store.
     ================================================================= -->
</head>
<body class="product-page">

<a class="skip" href="#main">تجاوز إلى المحتوى</a>
<div class="thread-progress" id="thread" aria-hidden="true"></div>

<nav class="topbar has-tabs" id="topbar" aria-label="التنقل الرئيسي">
  <a class="wordmark" href="index.html">هند</a>
  <div class="tabs">
    <a class="tab-home" href="index.html">الرئيسية</a>
    <a href="products.html" aria-current="page">القطع</a>
    <a href="about.html">من نحن</a>
    <a href="documentary.html">الوثائقي</a>
    <a href="follow.html">تابعونا</a>
  </div>
  <button class="cart-btn" type="button" data-cart-open aria-label="السلة">
    <svg class="bag" viewBox="0 0 18 22" aria-hidden="true" focusable="false"><path d="M6 7.2 V5.6 a3 3 0 0 1 6 0 V7.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><rect x="2.4" y="7.2" width="13.2" height="12.6" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <span class="cart-count" aria-live="polite" hidden>0</span>
  </button>
</nav>

<main id="main">

  <!-- The renderer replaces this whole subtree once JSON arrives. Until
       then it acts as a skeleton screen: mihrab-framed image slot and
       three text bars in the same layout as the real hero. -->
  <div id="product-root" aria-busy="true">
    <section class="section below-bar">
      <p class="crumb-row"><a class="crumb" href="products.html">عودة إلى كل القطع</a></p>
      <div class="product-top">
        <div class="gallery-carousel">
          <div class="photo carousel-window">
            <div class="skeleton skeleton-image" aria-hidden="true"></div>
          </div>
        </div>
        <div class="buy-panel">
          <span class="eyebrow">قطعة ولها حكاية</span>
          <div class="skeleton skeleton-title" aria-hidden="true"></div>
          <div class="skeleton skeleton-line" aria-hidden="true"></div>
          <div class="skeleton skeleton-line skeleton-line-short" aria-hidden="true"></div>
          <ul class="buy-meta">
            <li><span class="skeleton skeleton-line" aria-hidden="true"></span></li>
            <li><span class="skeleton skeleton-line" aria-hidden="true"></span></li>
            <li><span class="skeleton skeleton-line skeleton-line-short" aria-hidden="true"></span></li>
          </ul>
          <div class="buy-row">
            <span class="skeleton skeleton-price" aria-hidden="true"></span>
            <span class="skeleton skeleton-button" aria-hidden="true"></span>
          </div>
        </div>
      </div>
    </section>
    <p class="visually-hidden" role="status">جارٍ تحميل القطعة…</p>
  </div>

</main>
